# Client-specific production overrides.
# Combine with compose.base.yml and optional compose.modules.*.yml overlays.

services:
  postgres:
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}

      # File license mode is the default for client installs.
      # Backend uses FileLicenseStateProvider: extension modules (e.g. ext.finance) are licensed ONLY
      # from a valid signed license.json mounted at LICENSE_FILE_PATH. Pilot toggles / CP UI affect
      # "enabled" only; without ext.finance inside the file, bank/payments routes stay 404 (Not Found).
      LICENSE_MODE: ${LICENSE_MODE:-file}
      LICENSE_FILE_PATH: ${LICENSE_FILE_PATH:-/run/secrets/license.json}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}

      # Optional Control Plane license mode.
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-}
      # Backend uses CONTROL_PLANE_TOKEN ?? CONTROL_PLANE_INSTALLATION_TOKEN in Node; empty string
      # does not trigger ?? — so default TOKEN from INSTALLATION_TOKEN when TOKEN unset.
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:-${CONTROL_PLANE_INSTALLATION_TOKEN:-}}
      CONTROL_PLANE_INSTALLATION_ID: ${CONTROL_PLANE_INSTALLATION_ID:-}
      CONTROL_PLANE_INSTALLATION_TOKEN: ${CONTROL_PLANE_INSTALLATION_TOKEN:-}
      # Optional override; default is derived from CONTROL_PLANE_URL + installation id.
      CONTROL_PLANE_UPDATE_STATUS_URL: ${CONTROL_PLANE_UPDATE_STATUS_URL:-}

      # In-product update button talks to the updater service below (no client configuration needed).
      UPDATER_AGENT_URL: ${UPDATER_AGENT_URL:-http://updater:7788}
      UPDATER_AGENT_TOKEN: ${UPDATER_AGENT_TOKEN:-}
      AUTO_UPDATE_ENABLED: ${AUTO_UPDATE_ENABLED:-true}
      AUTO_UPDATE_CRON: ${AUTO_UPDATE_CRON:-*/15 * * * *}

      # Release metadata surfaced to ADMIN via GET /system/release and /system/update-status.
      CRM_RELEASE_VERSION: ${CRM_RELEASE_VERSION:-}
      GIT_SHA: ${GIT_SHA:-}
      BUILD_TIME: ${BUILD_TIME:-}
      IMAGE_TAG: ${IMAGE_TAG:-}

      LICENSE_CACHE_PATH: ${LICENSE_CACHE_PATH:-/data/license-cache.json}
      LICENSE_PUBLIC_KEY_PEM: ${LICENSE_PUBLIC_KEY_PEM:-}

      # Nova Poshta (TTN, sync) — must be passed explicitly; host .env alone does not inject into container.
      NP_API_URL: ${NP_API_URL:-https://api.novaposhta.ua/v2.0/json/}
      NP_API_KEY: ${NP_API_KEY:-}
      NP_API_TIMEOUT_MS: ${NP_API_TIMEOUT_MS:-30000}
      NP_SENDER_CITY_REF: ${NP_SENDER_CITY_REF:-}
      NP_SENDER_WAREHOUSE_REF: ${NP_SENDER_WAREHOUSE_REF:-}
      NP_SENDER_COUNTERPARTY_REF: ${NP_SENDER_COUNTERPARTY_REF:-}
      NP_SENDER_CONTACT_REF: ${NP_SENDER_CONTACT_REF:-}
      NP_SENDER_FIRST_NAME: ${NP_SENDER_FIRST_NAME:-}
      NP_SENDER_LAST_NAME: ${NP_SENDER_LAST_NAME:-}
      NP_SENDER_PHONE: ${NP_SENDER_PHONE:-}
      NP_DEFAULT_PAYER_TYPE: ${NP_DEFAULT_PAYER_TYPE:-Recipient}
      NP_DEFAULT_PAYMENT_METHOD: ${NP_DEFAULT_PAYMENT_METHOD:-Cash}

      # Google Drive product images (catalog / store) — host .env alone does not inject into container.
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}

      # Cron jobs (NP TTN status, sync, etc.)
      CRON_ENABLED: ${CRON_ENABLED:-true}

      # SMTP (workflow send_email, notifications) — «нова пошта» / корпоративна пошта в .env на хості
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}

      # Workflow external actions (optional; defaults match .env.base.example)
      WORKFLOW_EXTERNAL_ACTION_ATTEMPTS: ${WORKFLOW_EXTERNAL_ACTION_ATTEMPTS:-3}
      WORKFLOW_EXTERNAL_ACTION_BACKOFF_MS: ${WORKFLOW_EXTERNAL_ACTION_BACKOFF_MS:-5000}
      WORKFLOW_EXTERNAL_ACTION_TIMEOUT_MS: ${WORKFLOW_EXTERNAL_ACTION_TIMEOUT_MS:-30000}
      WORKFLOW_EXTERNAL_ACTION_CONCURRENCY: ${WORKFLOW_EXTERNAL_ACTION_CONCURRENCY:-5}
      FUEL_RECEIPTS_DIR: ${FUEL_RECEIPTS_DIR:-/data/fuel-receipts}
    volumes:
      # Default /dev/null = no real license file → only core modules are "licensed". Set
      # LICENSE_FILE_PATH_HOST to a host path with a real issued license.json (payload.modules includes ext.finance).
      - ${LICENSE_FILE_PATH_HOST:-/dev/null}:${LICENSE_FILE_PATH:-/run/secrets/license.json}:ro
      - license_cache:/data
      - fuel_receipts:/data/fuel-receipts
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-3001}:3001"

  web:
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"

  # Runs docker compose pull/up for one-click updates from Settings → Health.
  updater:
    build:
      context: .
      dockerfile: scripts/updater/Dockerfile
    restart: unless-stopped
    environment:
      UPDATER_AGENT_TOKEN: ${UPDATER_AGENT_TOKEN:-}
      UPDATER_REPO_ROOT: /deploy
      UPDATER_ENV_FILE: ${UPDATER_ENV_FILE:-/deploy/.env}
      UPDATER_COMPOSE_FILES: ${UPDATER_COMPOSE_FILES:-compose.base.yml,compose.client.yml}
      UPDATER_MANIFEST_URL: ${UPDATER_MANIFEST_URL:-}
      UPDATER_MANIFEST_PATH: ${UPDATER_MANIFEST_PATH:-/deploy/deployment-manifest.json}
      UPDATER_LOG_DIR: /deploy/.updater-logs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/deploy
    expose:
      - "7788"

volumes:
  postgres_data:
    name: ${POSTGRES_DATA_VOLUME:-crm_postgres_data}
  license_cache:
    name: ${LICENSE_CACHE_VOLUME:-crm_license_cache}
  fuel_receipts:
    name: ${FUEL_RECEIPTS_VOLUME:-crm_fuel_receipts}
