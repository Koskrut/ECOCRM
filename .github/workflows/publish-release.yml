name: Publish Registry Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v, for example 0.2.83"
        required: true
        type: string
      channel:
        description: "Control Plane release channel"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
          - edge
      include_outbound_in_manifest:
        description: "Legacy: when modules is empty, treat as modules=outbound. Prefer `modules` CSV instead."
        required: false
        type: boolean
        default: false
      modules:
        description: "Comma-separated module slugs: outbound, google-sheet, ringostat, bitrix, np, finance, planning, kyivstar-fmc. Leave empty: no extra module images for 0.1.x; for 0.2.x (tag or dispatch) empty means build all."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: koskrut
  CONTROL_PLANE_URL: ${{ secrets.CONTROL_PLANE_URL }}
  CONTROL_PLANE_CI_TOKEN: ${{ secrets.CONTROL_PLANE_CI_TOKEN }}

jobs:
  publish:
    name: Build, Push, Register
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.version || '' }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          fi

          if [ -z "$VERSION" ] || [ "$VERSION" = "0.0.0-dev" ]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

          CHANNEL="${{ inputs.channel || 'stable' }}"
          BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")"
          GIT_SHA="$(git rev-parse HEAD)"
          BACKEND_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/crm-backend-core:${VERSION}"
          WEB_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/crm-web:${VERSION}"
          STORE_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/crm-store:${VERSION}"
          OUTBOUND_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/crm-module-outbound:${VERSION}"
          CORE_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/crm-core-api:${VERSION}"

          {
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "build_time=$BUILD_TIME"
            echo "git_sha=$GIT_SHA"
            echo "backend_image=$BACKEND_IMAGE"
            echo "core_image=$CORE_IMAGE"
            echo "web_image=$WEB_IMAGE"
            echo "store_image=$STORE_IMAGE"
            echo "outbound_image=$OUTBOUND_IMAGE"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Control Plane secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CONTROL_PLANE_URL"
          test -n "$CONTROL_PLANE_CI_TOKEN"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.backend_image }}
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ steps.meta.outputs.git_sha }}
            CRM_RELEASE_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ steps.meta.outputs.git_sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            IMAGE_TAG=${{ steps.meta.outputs.backend_image }}

      - name: Build and push crm-core-api (core-only Nest entrypoint)
        id: core_api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          target: core-runner
          push: true
          tags: ${{ steps.meta.outputs.core_image }}
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ steps.meta.outputs.git_sha }}
            CRM_RELEASE_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ steps.meta.outputs.git_sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            IMAGE_TAG=${{ steps.meta.outputs.core_image }}

      - name: Build and push web
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.web_image }}
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ steps.meta.outputs.git_sha }}

      - name: Build and push store
        id: store
        uses: docker/build-push-action@v6
        with:
          context: ./apps/store
          file: ./apps/store/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.store_image }}
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ steps.meta.outputs.git_sha }}

      - name: Resolve modules CSV for optional module images
        id: modules_csv
        shell: bash
        env:
          RAW_MODULES: ${{ inputs.modules }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          LEG="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_outbound_in_manifest }}" = "true" ]; then
            LEG="true"
          fi
          RAW="${RAW_MODULES:-}"
          # Empty CSV: for 0.2.x line, build all optional module images (tag push has no inputs; dispatch may omit modules).
          if [ -z "$RAW" ] && echo "$VERSION" | grep -qE '^0\.2\.'; then
            RAW="outbound,google-sheet,ringostat,bitrix,np,finance,planning,kyivstar-fmc"
          fi
          RESOLVED=$(node scripts/resolve-modules-csv.mjs "$RAW" "${LEG}")
          echo "csv=${RESOLVED}" >> "$GITHUB_OUTPUT"

      - name: Build and push optional module images (CSV)
        if: ${{ steps.modules_csv.outputs.csv != '' }}
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GIT_SHA: ${{ steps.meta.outputs.git_sha }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          REPO_ROOT: ${{ github.workspace }}
          MODULES_CSV: ${{ steps.modules_csv.outputs.csv }}
        run: node scripts/ci-publish-module-builds.mjs

      - name: Create Control Plane deployment manifest
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
          GIT_SHA: ${{ steps.meta.outputs.git_sha }}
          BACKEND_IMAGE: ${{ steps.meta.outputs.backend_image }}
          CORE_IMAGE: ${{ steps.meta.outputs.core_image }}
          WEB_IMAGE: ${{ steps.meta.outputs.web_image }}
          STORE_IMAGE: ${{ steps.meta.outputs.store_image }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          CORE_DIGEST: ${{ steps.core_api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          STORE_DIGEST: ${{ steps.store.outputs.digest }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_REPO: ${{ github.server_url }}/${{ github.repository }}
          RAW_COMPOSE_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          function splitImage(image) {
            const index = image.lastIndexOf(":");
            return {
              repository: image.slice(0, index),
              tag: image.slice(index + 1),
            };
          }

          const backend = splitImage(process.env.BACKEND_IMAGE);
          const coreApi = splitImage(process.env.CORE_IMAGE);
          const web = splitImage(process.env.WEB_IMAGE);
          const store = splitImage(process.env.STORE_IMAGE);

          let addon = { images: [], composeFiles: [], moduleCodes: [] };
          if (fs.existsSync("module-manifest-addon.json")) {
            addon = JSON.parse(fs.readFileSync("module-manifest-addon.json", "utf8"));
          }
          if (!process.env.CORE_DIGEST) {
            throw new Error("CORE_DIGEST missing (crm-core-api build step)");
          }

          const images = [
            {
              role: "backend_core",
              serviceName: "backend",
              imageRepository: backend.repository,
              imageTag: backend.tag,
              imageDigest: process.env.BACKEND_DIGEST,
            },
            {
              // CP allowlist uses generic "other" for images outside backend_core/web/store/module_*;
              // serviceName distinguishes crm-core-api from full backend digest (same compose service "backend").
              role: "other",
              serviceName: "crm-core-api",
              imageRepository: coreApi.repository,
              imageTag: coreApi.tag,
              imageDigest: process.env.CORE_DIGEST,
            },
            {
              role: "web",
              serviceName: "web",
              imageRepository: web.repository,
              imageTag: web.tag,
              imageDigest: process.env.WEB_DIGEST,
            },
            {
              role: "store",
              serviceName: "store",
              imageRepository: store.repository,
              imageTag: store.tag,
              imageDigest: process.env.STORE_DIGEST,
            },
          ];

          for (const row of addon.images ?? []) {
            images.push(row);
          }

          const composeFiles = ["compose.base.yml", "compose.client.yml", "compose.modules.store.yml"];
          for (const cf of addon.composeFiles ?? []) {
            if (!composeFiles.includes(cf)) composeFiles.push(cf);
          }

          const moduleCodes = ["core.crm"];
          for (const c of addon.moduleCodes ?? []) {
            if (c && !moduleCodes.includes(c)) moduleCodes.push(c);
          }

          const semverMinor = /^(\d+\.\d+)\./.exec(process.env.VERSION ?? "");
          const compatLine = semverMinor ? `${semverMinor[1]}.x` : "0.2.x";

          const payload = {
            version: process.env.VERSION,
            channel: process.env.CHANNEL,
            status: "published",
            registryProvider: "ghcr",
            registryHost: "ghcr.io",
            sourceRepo: process.env.SOURCE_REPO,
            gitSha: process.env.GIT_SHA,
            ciRunUrl: process.env.CI_RUN_URL,
            builtAt: process.env.BUILD_TIME,
            composeFiles,
            moduleCodes,
            compatibility: {
              line: compatLine,
            },
            images,
          };

          const rawBase = (process.env.RAW_COMPOSE_BASE ?? "").replace(/\/$/, "");
          if (rawBase) {
            const composeFileUrls = {};
            for (const cf of composeFiles) {
              composeFileUrls[cf] = `${rawBase}/${cf}`;
            }
            payload.composeFileUrls = composeFileUrls;
          }

          fs.writeFileSync("deployment-manifest.json", `${JSON.stringify(payload, null, 2)}\n`);
          NODE

      - name: Register release in Control Plane
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -X POST "${CONTROL_PLANE_URL%/}/api/ci/releases/register" \
            -H "Authorization: Bearer $CONTROL_PLANE_CI_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @deployment-manifest.json
