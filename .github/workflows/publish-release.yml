name: Publish Registry Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v, for example 0.1.4"
        required: true
        type: string
      channel:
        description: "Control Plane release channel"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
          - edge
      include_outbound_in_manifest:
        description: "Build crm-module-outbound and add as 4th image (module_outbound). Control Plane must have Prisma migration for module_outbound applied (cp migrate deploy) or Register release fails."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: koskrut
  CONTROL_PLANE_URL: ${{ secrets.CONTROL_PLANE_URL }}
  CONTROL_PLANE_CI_TOKEN: ${{ secrets.CONTROL_PLANE_CI_TOKEN }}

jobs:
  publish:
    name: Build, Push, Register
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.version || '' }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          fi

          if [ -z "$VERSION" ] || [ "$VERSION" = "0.0.0-dev" ]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

          CHANNEL="${{ inputs.channel || 'stable' }}"
          BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")"
          GIT_SHA="$(git rev-parse --short HEAD)"
          BACKEND_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/crm-backend-core:${VERSION}"
          WEB_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/crm-web:${VERSION}"
          STORE_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/crm-store:${VERSION}"
          OUTBOUND_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/crm-module-outbound:${VERSION}"

          {
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "build_time=$BUILD_TIME"
            echo "git_sha=$GIT_SHA"
            echo "backend_image=$BACKEND_IMAGE"
            echo "web_image=$WEB_IMAGE"
            echo "store_image=$STORE_IMAGE"
            echo "outbound_image=$OUTBOUND_IMAGE"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Control Plane secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CONTROL_PLANE_URL"
          test -n "$CONTROL_PLANE_CI_TOKEN"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend_image }}
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ steps.meta.outputs.git_sha }}
            CRM_RELEASE_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ steps.meta.outputs.git_sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            IMAGE_TAG=${{ steps.meta.outputs.backend_image }}

      - name: Build and push web
        id: web
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.web_image }}
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ steps.meta.outputs.git_sha }}

      - name: Build and push store
        id: store
        uses: docker/build-push-action@v6
        with:
          context: ./apps/store
          file: ./apps/store/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.store_image }}
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ steps.meta.outputs.git_sha }}

      - name: Build and push crm-module-outbound
        id: outbound
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_outbound_in_manifest }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          target: outbound-runner
          push: true
          tags: ${{ steps.meta.outputs.outbound_image }}
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ steps.meta.outputs.git_sha }}
            CRM_RELEASE_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ steps.meta.outputs.git_sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            IMAGE_TAG=${{ steps.meta.outputs.outbound_image }}

      - name: Create Control Plane deployment manifest
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
          GIT_SHA: ${{ steps.meta.outputs.git_sha }}
          BACKEND_IMAGE: ${{ steps.meta.outputs.backend_image }}
          WEB_IMAGE: ${{ steps.meta.outputs.web_image }}
          STORE_IMAGE: ${{ steps.meta.outputs.store_image }}
          OUTBOUND_IMAGE: ${{ steps.meta.outputs.outbound_image }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          STORE_DIGEST: ${{ steps.store.outputs.digest }}
          OUTBOUND_DIGEST: ${{ steps.outbound.outputs.digest }}
          INCLUDE_OUTBOUND_IN_MANIFEST: ${{ (github.event_name == 'workflow_dispatch' && inputs.include_outbound_in_manifest) && 'true' || 'false' }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          function splitImage(image) {
            const index = image.lastIndexOf(":");
            return {
              repository: image.slice(0, index),
              tag: image.slice(index + 1),
            };
          }

          const backend = splitImage(process.env.BACKEND_IMAGE);
          const web = splitImage(process.env.WEB_IMAGE);
          const store = splitImage(process.env.STORE_IMAGE);

          const includeOutbound = process.env.INCLUDE_OUTBOUND_IN_MANIFEST === "true";
          if (includeOutbound) {
            if (!process.env.OUTBOUND_DIGEST) {
              throw new Error("OUTBOUND_DIGEST required when INCLUDE_OUTBOUND_IN_MANIFEST=true");
            }
          }

          const images = [
            {
              role: "backend_core",
              serviceName: "backend",
              imageRepository: backend.repository,
              imageTag: backend.tag,
              imageDigest: process.env.BACKEND_DIGEST,
            },
            {
              role: "web",
              serviceName: "web",
              imageRepository: web.repository,
              imageTag: web.tag,
              imageDigest: process.env.WEB_DIGEST,
            },
            {
              role: "store",
              serviceName: "store",
              imageRepository: store.repository,
              imageTag: store.tag,
              imageDigest: process.env.STORE_DIGEST,
            },
          ];

          if (includeOutbound) {
            const ob = splitImage(process.env.OUTBOUND_IMAGE);
            images.push({
              role: "module_outbound",
              serviceName: "backend-outbound",
              imageRepository: ob.repository,
              imageTag: ob.tag,
              imageDigest: process.env.OUTBOUND_DIGEST,
            });
          }

          const payload = {
            version: process.env.VERSION,
            channel: process.env.CHANNEL,
            status: "published",
            registryProvider: "ghcr",
            registryHost: "ghcr.io",
            sourceRepo: process.env.SOURCE_REPO,
            gitSha: process.env.GIT_SHA,
            ciRunUrl: process.env.CI_RUN_URL,
            builtAt: process.env.BUILD_TIME,
            composeFiles: [
              "compose.base.yml",
              "compose.client.yml",
            ],
            moduleCodes: [
              "core.crm",
            ],
            compatibility: {
              line: "0.1.x",
            },
            images,
          };

          fs.writeFileSync("deployment-manifest.json", `${JSON.stringify(payload, null, 2)}\n`);
          NODE

      - name: Register release in Control Plane
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -X POST "${CONTROL_PLANE_URL%/}/api/ci/releases/register" \
            -H "Authorization: Bearer $CONTROL_PLANE_CI_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @deployment-manifest.json
