name: Preflight Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for build args and manifest dry-run (without leading v)"
        required: true
        default: "0.1.0-rc"
        type: string
      include_outbound_in_manifest:
        description: "Include outbound image row in manifest dry-run"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  preflight:
    name: Build Images And Validate Manifest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            echo "version input must not be empty" >&2
            exit 1
          fi
          GIT_SHA="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")"
          {
            echo "version=$VERSION"
            echo "git_sha=$GIT_SHA"
            echo "build_time=$BUILD_TIME"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          tags: local/crm-backend-core:preflight
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ steps.meta.outputs.git_sha }}
            CRM_RELEASE_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ steps.meta.outputs.git_sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            IMAGE_TAG=local/crm-backend-core:preflight

      - name: Build web image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: local/crm-web:preflight
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ steps.meta.outputs.git_sha }}

      - name: Build store image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/store
          file: ./apps/store/Dockerfile
          push: false
          tags: local/crm-store:preflight
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ steps.meta.outputs.git_sha }}

      - name: Build outbound image target (no push)
        if: ${{ inputs.include_outbound_in_manifest }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          target: outbound-runner
          push: false
          tags: local/crm-module-outbound:preflight
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ steps.meta.outputs.git_sha }}
            CRM_RELEASE_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ steps.meta.outputs.git_sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            IMAGE_TAG=local/crm-module-outbound:preflight

      - name: Manifest dry-run
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          INCLUDE_OUTBOUND_IN_MANIFEST: ${{ inputs.include_outbound_in_manifest && 'true' || 'false' }}
        run: |
          set -euo pipefail
          sh scripts/rollout-loop-dry-run.sh
          node scripts/validate-deployment-manifest.mjs .local/rollout-dry-run/deployment-manifest.json
