# Integrations activation overlay.
# Current state: int.* modules are still in-process inside crm-backend-core.

services:
  backend:
    environment:
      MODULE_GATING_ENABLED: "true"
      CRON_ENABLED: ${CRON_ENABLED:-true}

      # int.integrations_telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_LEAD_COMPANY_ID: ${TELEGRAM_LEAD_COMPANY_ID:-}
      STORE_TELEGRAM_BOT_USERNAME: ${STORE_TELEGRAM_BOT_USERNAME:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # int.nova_poshta
      NP_API_URL: ${NP_API_URL:-https://api.novaposhta.ua/v2.0/json/}
      NP_API_KEY: ${NP_API_KEY:-}
      NP_API_TIMEOUT_MS: ${NP_API_TIMEOUT_MS:-30000}
      NP_SENDER_CITY_REF: ${NP_SENDER_CITY_REF:-}
      NP_SENDER_COUNTERPARTY_REF: ${NP_SENDER_COUNTERPARTY_REF:-}
      NP_SENDER_CONTACT_REF: ${NP_SENDER_CONTACT_REF:-}
      NP_SENDER_WAREHOUSE_REF: ${NP_SENDER_WAREHOUSE_REF:-}
      NP_SENDER_FIRST_NAME: ${NP_SENDER_FIRST_NAME:-}
      NP_SENDER_LAST_NAME: ${NP_SENDER_LAST_NAME:-}
      NP_SENDER_PHONE: ${NP_SENDER_PHONE:-}
      NP_DEFAULT_PAYER_TYPE: ${NP_DEFAULT_PAYER_TYPE:-Recipient}
      NP_DEFAULT_PAYMENT_METHOD: ${NP_DEFAULT_PAYMENT_METHOD:-Cash}

      # int.google_sheet / Google Drive product image sync
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}

      # int.bitrix
      BITRIX_SYNC_ENABLED: ${BITRIX_SYNC_ENABLED:-false}
      BITRIX_WEBHOOK_ENABLED: ${BITRIX_WEBHOOK_ENABLED:-false}
      BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL:-}
      BITRIX_WEBHOOK_SECRET: ${BITRIX_WEBHOOK_SECRET:-}
      BITRIX_MYSQL_HOST: ${BITRIX_MYSQL_HOST:-}
      BITRIX_MYSQL_PORT: ${BITRIX_MYSQL_PORT:-}
      BITRIX_MYSQL_USER: ${BITRIX_MYSQL_USER:-}
      BITRIX_MYSQL_PASSWORD: ${BITRIX_MYSQL_PASSWORD:-}
      BITRIX_MYSQL_DATABASE: ${BITRIX_MYSQL_DATABASE:-}
      BITRIX_MYSQL_CONNECT_TIMEOUT_MS: ${BITRIX_MYSQL_CONNECT_TIMEOUT_MS:-60000}
      BITRIX_IMPORT_BATCH_SIZE: ${BITRIX_IMPORT_BATCH_SIZE:-1000}
      BITRIX_IMPORT_CONCURRENCY: ${BITRIX_IMPORT_CONCURRENCY:-4}
      BITRIX_IMPORT_EMPLOYEES_ONLY: ${BITRIX_IMPORT_EMPLOYEES_ONLY:-true}
      BITRIX_IMPORT_ORDER_TX_TIMEOUT_MS: ${BITRIX_IMPORT_ORDER_TX_TIMEOUT_MS:-60000}
      BITRIX_IMPORT_ORDER_ITEM_TX_TIMEOUT_MS: ${BITRIX_IMPORT_ORDER_ITEM_TX_TIMEOUT_MS:-60000}

      # int.ringostat
      RINGOSTAT_API_URL: ${RINGOSTAT_API_URL:-https://api.ringostat.net}
      RINGOSTAT_API_TOKEN: ${RINGOSTAT_API_TOKEN:-}
