# Nginx + Let's Encrypt for CRM and Store.
# On server: copy to /etc/nginx/sites-available/, symlink to sites-enabled,
# run certbot, reload nginx. See deploy/nginx/README.md
#
# Do NOT add proxy_set_header Connection 'upgrade' (or Upgrade) on location /
# unless that location serves WebSockets. Forcing upgrade on every request breaks
# POST bodies through Next.js /api proxies to the backend.

# Apex → canonical public site (www). Without this, Host: suprex.dental hits the default vhost (CRM).
# After certbot, add the same return 301 inside server { listen 443 ssl; server_name suprex.dental; ... }.
server {
    listen 80;
    server_name suprex.dental;
    return 301 https://www.suprex.dental$request_uri;
}

# CRM — crm.suprex.dental → web (3000), Bitrix/Telegram webhooks → backend (3001)
server {
    listen 80;
    server_name crm.suprex.dental;

    # Bitrix webhook — на backend (3001)
    location /integrations/bitrix/webhook {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-bitrix-webhook-secret $http_x_bitrix_webhook_secret;
    }

    # Telegram webhook — на backend (3001); после certbot тот же server получает listen 443 ssl
    location /integrations/telegram/webhook {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Store — www.suprex.dental → store (3002)
# SEO cleanup (post–WordPress): см. deploy/nginx/README.md — после certbot продублируйте
# блоки ниже (до location /) в server { listen 443 ssl ... } для www, если он отделён.
server {
    listen 80;
    server_name www.suprex.dental;

    # A) Query string состоит ТОЛЬКО из мусорных WooCommerce-параметров → 301 на path без args
    # (смешанные query обрабатывает Next middleware в apps/store — сохраняет прочие параметры)
    if ($args ~* ^((add-to-cart|per_page|per_row|shop_view|woo_ajax|loop)=[^&]*)(&((add-to-cart|per_page|per_row|shop_view|woo_ajax|loop)=[^&]*))*$) {
        return 301 https://$host$uri;
    }

    # B) Явный legacy — не трогаем /product-category/, /shop/, /catalog/, /pricelist/
    location ~* ^/about-us-3/?$ {
        return 301 https://$host/about;
    }
    location ~* ^/portfolio(/|$) {
        return 410;
    }
    location ~* ^/project-cat(/|$) {
        return 410;
    }
    location ~* ^/tag(/|$) {
        return 410;
    }
    location ~* ^/blog(/|$) {
        return 410;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API — api.suprex.dental → backend (3001), public URL for webhooks
server {
    listen 80;
    server_name api.suprex.dental;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
