# Production stack for Netcup (or any VPS).
# Usage: copy .env from apps/backend/.env.example, add POSTGRES_PASSWORD, then:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: crm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Internal only — do not publish 5432 to the host/internet.
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runner
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD}@postgres:5432/crm
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      CRON_ENABLED: "true"
      BITRIX_SYNC_ENABLED: ${BITRIX_SYNC_ENABLED:-"false"}
      BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL:-}
      BITRIX_WEBHOOK_SECRET: ${BITRIX_WEBHOOK_SECRET}
      BITRIX_MYSQL_HOST: ${BITRIX_MYSQL_HOST}
      BITRIX_MYSQL_PORT: ${BITRIX_MYSQL_PORT}
      BITRIX_MYSQL_USER: ${BITRIX_MYSQL_USER}
      BITRIX_MYSQL_PASSWORD: ${BITRIX_MYSQL_PASSWORD}
      BITRIX_MYSQL_DATABASE: ${BITRIX_MYSQL_DATABASE}
      # Optional release metadata for GET /system/release (set in .env or CI build)
      CRM_RELEASE_VERSION: ${CRM_RELEASE_VERSION:-}
      GIT_SHA: ${GIT_SHA:-}
      BUILD_TIME: ${BUILD_TIME:-}
      IMAGE_TAG: ${IMAGE_TAG:-}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-http://osrm:5000}
      ROUTING_PROFILE: ${ROUTING_PROFILE:-car}
    depends_on:
      postgres:
        condition: service_healthy
      osrm:
        condition: service_started
    ports:
      - "3001:3001"
    restart: unless-stopped
    logging: *default-logging

  osrm:
    image: osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/ukraine.osrm
    volumes:
      - osrm_data:/data:ro
    restart: unless-stopped
    logging: *default-logging
    # Internal only — do not publish port 5000 to the internet.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      API_URL: http://backend:3001
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped
    logging: *default-logging

  store:
    build:
      context: ./apps/store
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      API_URL: http://backend:3001
    depends_on:
      - backend
    ports:
      - "3002:3002"
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  # Populate before first start: deploy/osrm/README.md (ukraine.osrm* from build script).
  osrm_data:
